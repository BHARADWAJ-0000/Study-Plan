services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: monkeymax
      POSTGRES_USER: monkeymax
      POSTGRES_PASSWORD: monkeymax_local_only
    ports:
      - "5432:5432"
    volumes:
      - monkeymax_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  monkeymax_pg:
